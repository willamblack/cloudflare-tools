name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Docker tag to publish (for example, 0.01)
        required: true
        default: "0.01"
        type: string
      publish_latest:
        description: Also update latest (normally only stable Git tags should do this)
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Prepare embedded frontend
        run: cp -R Frontend/dist Server/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: Server/go.mod
          cache-dependency-path: Server/go.sum

      - name: Test backend
        working-directory: Server
        run: go test ./...

      - name: Vet backend
        working-directory: Server
        run: go vet ./...

  smoke:
    name: Build and run container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build smoke-test image
        run: docker build --tag cloudflare-tools:smoke .

      - name: Start container and verify HTTP/authentication
        env:
          ADMIN_USERNAME: smoke-admin
          ADMIN_PASSWORD: smoke-test-password-2026
          JWT_SECRET: smoke-test-jwt-secret-with-at-least-32-characters
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 \
            --env ADMIN_USERNAME --env ADMIN_PASSWORD --env JWT_SECRET \
            cloudflare-tools:smoke)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep --quiet '<title>Cloudflare 批量管理工具</title>'
          unauthenticated_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/api/certs/download/example.zip)"
          test "$unauthenticated_status" = "401"
          token="$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"$ADMIN_USERNAME\",\"password\":\"$ADMIN_PASSWORD\"}" \
            http://127.0.0.1:18080/api/login | jq --raw-output .token)"
          test -n "$token"
          test "$(curl --fail --silent --show-error --header "Authorization: Bearer $token" \
            http://127.0.0.1:18080/api/accounts)" = "[]"
          created="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data '{"name":"smoke","email":"smoke@example.com","key":"fake-smoke-key"}' \
            http://127.0.0.1:18080/api/accounts)"
          account_id="$(jq --raw-output .id <<< "$created")"
          test -n "$account_id"
          test "$(jq --raw-output .key <<< "$created")" = ""
          edited="$(curl --fail --silent --show-error --request PUT \
            --header "Authorization: Bearer $token" --header 'Content-Type: application/json' \
            --data '{"name":"smoke-edited","email":"edited@example.com","key":""}' \
            "http://127.0.0.1:18080/api/accounts/$account_id")"
          test "$(jq --raw-output .name <<< "$edited")" = "smoke-edited"
          test "$(jq --raw-output .key <<< "$edited")" = ""
          test "$(curl --fail --silent --show-error --header "Authorization: Bearer $token" \
            http://127.0.0.1:18080/api/accounts | jq --raw-output '.[0].email')" = "edited@example.com"

  publish:
    name: Build and publish image
    needs:
      - validate
      - smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manual version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Docker version tag: $VERSION" >&2
            exit 1
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=match,pattern=^v(.*)$,group=1
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_latest) }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and optionally publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
