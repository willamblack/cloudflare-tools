services:
  cloudflare-tools:
    image: ghcr.io/willamblack/cloudflare-tools:${CLOUDFLARE_TOOLS_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudflare-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:28080:8080"
    volumes:
      - ./data:/data
      - acme-data:/root/.acme.sh
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - cloudflare-net

networks:
  cloudflare-net:
    driver: bridge

volumes:
  acme-data:
